name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.TaylanTatli.iCloud-Linux.flatpak
          manifest-path: flatpak/io.github.TaylanTatli.iCloud-Linux.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Release'e yükle
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: io.github.TaylanTatli.iCloud-Linux.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
